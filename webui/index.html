<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('jeikcode.theme');
          var resolved = 'dark';
          if (t === 'light') {
            resolved = 'light';
          } else if (t === 'dark') {
            resolved = 'dark';
          } else {
            var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
            resolved = (m && m.matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          if (t) document.documentElement.setAttribute('data-theme-preference', t);
        } catch (e) {}
      })();
    </script>
    <title>JeikCode - Open-Source AI Coding Agent</title>
    <meta
      name="description"
      content="JeikCode is a high-performance, Rust-powered open-source AI Coding Agent featuring CodeExplore semantic graphs, append-only KV cache protection, Git-like atomic state machines, and 9k minimal prompts."
    />
    <meta property="og:title" content="JeikCode - Open-Source AI Coding Agent" />
    <meta
      property="og:description"
      content="High-performance, Rust-powered open-source AI Coding Agent driven by CodeExplore semantic graphs and append-only KV cache protection."
    />
    <link rel="icon" type="image/png" href="./favicon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
