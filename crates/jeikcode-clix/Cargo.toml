[package]
name = "jeikcode-clix"
version.workspace = true
edition = "2021"
description = "Standalone new-stack CLI (D-layer driver): `code` drives the full coding agent (prepare/assemble), `review` drives the jeikcode-review agent over a git diff. Decoupled from jeikcode-cli / jeikcode-core."

[[bin]]
name = "jeikcodex"
path = "src/main.rs"

[dependencies]
jeikcode-review = { path = "../jeikcode-review" }
jeikcode-coding = { path = "../jeikcode-coding" }
# Direct dep for the D-layer pieces the driver owns: MemoryStore (slash commands),
# the typed approval wire contract, SessionManager (session listing).
jeikcode-capabilities = { path = "../jeikcode-capabilities", features = ["provider", "tools", "session", "memory", "mcp"] }
jeikcode-kernel = { path = "../jeikcode-kernel" }
jeikcode-config = { path = "../jeikcode-config" }
# Standalone telemetry sink (clix is core-decoupled, so it resolves + inits its own,
# mirroring jeikcode-cli) — feeds LlmChat/ToolCall events for both subcommands.
jeikcode-telemetry = { path = "../jeikcode-telemetry" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
# Capturable in-memory telemetry sink + a canned provider stream for the metering test.
jeikcode-telemetry = { path = "../jeikcode-telemetry", features = ["test-util"] }
futures = "0.3"
async-trait = "0.1"
