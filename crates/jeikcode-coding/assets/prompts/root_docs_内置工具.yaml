# root_docs_内置工具.yaml
# 本文档不加载进模型。仅供人类阅读。
# 运行时工具 schema 来自 Rust `Tool::description()` / `parameters_schema()`。
# ==============================================================================
# JeikCode 内置工具说明（种子文档）
# 已按用户需求裁剪：移除了未启用的细粒度 CodeIntel 衍生工具与 JeikCode 平台工具，
# 仅保留真实挂载且高频的核心工具。修改本文件不会改变线上 tools 列表。
# 【提示】：每个参数均包含精准的【中文翻译】与【作用说明】注释。
# ==============================================================================

version: "2.0.0"

tools:
  # ============================================================================
  # 一、核心文件与系统操作 (Filesystem & Shell)
  # ============================================================================
  - name: "read"
    category: "filesystem"
    aliases: ["read_file"]
    # 【中文】：大块读取文件内容（单次读取数百行或整文件安全且符合预期），查看图像或列出目录。
    description: "Read file content generously (reading several hundred lines or the whole file in one call is safe and expected), view images, or list directories."
    parameters:
      path:
        type: "string"
        required: true
        # 【中文】：待检查的文件或目录路径（执行层亦兼容别名 file_path）。
        description: "Path to the file or directory to inspect."
      offset:
        type: "integer"
        required: false
        # 【中文】：起始行号（1-based）。支持负数从末尾读取（如 -200）。与 limit 配合用于翻页。当提供 key_string 时忽略。
        description: "1-based starting line. Supports negative values to read from tail (e.g. -200). Use with `limit` to page large files. Ignored when key_string is provided."
      limit:
        type: "integer"
        required: false
        # 【中文】：读取行数（默认 1500）。单次读取数百行或整个文件是安全且符合预期的。当提供 key_string 时忽略。
        description: "Number of lines to read from `offset` (defaults to 1500). Reading several hundred lines or the whole file in one call is safe and expected. Ignored when key_string is provided."
      key_string:
        type: "string"
        required: false
        # 【中文】：可选的代码或文本片段，以其为中心居中展开读取窗口（大小写不敏感）。提供时将忽略 offset 和 limit。
        description: "Optional snippet to center the reading window around (case-insensitive). When provided, `offset` and `limit` are ignored; use `upward`, `downward`, and `max_matches` instead."
      upward:
        type: "integer"
        required: false
        # 【中文】：key_string 匹配项上方的上下文行数（默认 25）。仅在指定 key_string 时使用。
        description: "Context lines above each key_string match (default 25). Used only when key_string is specified; ignored otherwise."
      downward:
        type: "integer"
        required: false
        # 【中文】：key_string 匹配项下方的上下文行数（默认 75）。仅在指定 key_string 时使用。
        description: "Context lines below each key_string match (default 75). Used only when key_string is specified; ignored otherwise."
      max_matches:
        type: "integer"
        required: false
        # 【中文】：最多显示的 key_string 匹配项数量。仅在指定 key_string 时使用。
        description: "Maximum matches to show for key_string. Used only when key_string is specified; ignored otherwise. If omitted, all matches are shown."
    guidance: "Use read instead of `bash cat`."

  - name: "write"
    category: "filesystem"
    aliases: ["write_file"]
    # 【中文】：向文件写入完整内容，若文件不存在则自动创建所需父目录。修改现有文件前请先使用 read 读取文件内容后再写入。用于创建全新文件或完全覆写现有文件，局部修改是不支持的。
    description: "Write content to a file. Creates file and parent directories if absent, or overwrites existing file content. Read the file with `read` before overwriting. Use for creating new files or fully replacing existing files; partial modifications are not supported."
    parameters:
      path:
        type: "string"
        required: true
        # 【中文】：目标文件路径（支持相对或绝对路径，执行层亦兼容 file_path 别名）。
        description: "File path to write (relative or absolute). Parent directories are created automatically if absent."
      content:
        type: "string"
        required: true
        # 【中文】：写入文件的完整内容。
        description: "Full content to write."
    guidance: "Use write for new files or full rewrites; use edit for targeted edits."

  - name: "edit"
    category: "filesystem"
    aliases: ["edit_file"]
    # 【中文】：通过精确字符串匹配替换现有文件中的代码片段。修改前请先使用 read 获取精确内容。用于局部修改文件内容。
    description: "Modify file content via exact string replacement. Read the file with `read` before editing. Use for partial file modifications."
    parameters:
      path:
        type: "string"
        required: true
        # 【中文】：要修改的文件路径（支持相对或绝对路径，亦兼容 file_path、target_file 等别名）
        description: "Path of the file to edit (relative or absolute)."
      edits:
        type: "array"
        required: true
        # 【中文】：填入每一处需要修改的替换项数组
        description: "Series of replacement edits to apply in sequence."
        items:
          old_string:
            type: "string"
            required: true
            # 【中文】：待查找替换的精确原代码片段
            description: "Exact text to find and replace."
          new_string:
            type: "string"
            required: true
            # 【中文】：替换后的新代码片段
            description: "Replacement text."
          replace_all:
            type: "boolean"
            required: false
            default: false
            # 【中文】：是否替换文件中所有匹配项（默认 false）
            description: "Replace all occurrences (default false)."
          occurrence:
            type: "integer"
            required: false
            # 【中文】：当 old_string 在文件中多次出现时的 1-based 匹配序号
            description: "1-based match index when old_string appears multiple times."
    guidance: "Read file with read first. Ensure old_string is unique or set replace_all=true. Same file: one edits array. Other files: parallel edit."

  - name: "glob"
    category: "filesystem"
    # 【中文】：跨目录按通配符模式匹配文件路径。用于按文件名、扩展名或路径模式查找文件位置。通过文件名寻找符号定义时配合 grep 或 code_explore 使用。
    description: "Match file paths across directories using glob patterns. Use to find file locations by name, extension, or path pattern. Pair with `grep` or `code_explore` when locating symbol definitions by filename."
    parameters:
      pattern:
        type: "string"
        required: true
        # 【中文】：通配符模式。
        description: "Glob pattern."
      path:
        type: "string"
        required: false
        default: "."
        # 【中文】：匹配范围目录。
        description: "Directory scope to match."
      limit:
        type: "integer"
        required: false
        default: 300
        # 【中文】：最多返回的文件路径数量。
        description: "Maximum paths to return."


  - name: "grep"
    category: "filesystem"
    # 【中文】：使用正则或纯文本在文件中搜索内容，支持上下文行输出、忽略大小写与文件过滤。用于查找错误日志、精确文本片段或符号名。探索代码调用关系时请使用 code_explore。
    description: "Search file contents by regular expression or literal text, supporting context lines, case-insensitivity, and glob filtering. Use to find error messages, exact text snippets, or symbol names. Use `code_explore` when tracing call relationships."
    parameters:
      pattern:
        type: "string"
        required: true
        # 【中文】：搜索文本或正则表达式。
        description: "Regex pattern or exact text to search for."
      path:
        type: "string"
        required: false
        default: "."
        # 【中文】：搜索目录或文件。
        description: "Directory or file to search (default: working directory)."
      glob:
        type: "string"
        required: false
        # 【中文】：文件通配过滤（如 `*.rs`）。
        description: "File glob pattern to restrict search (e.g. '*.rs', '*.{ts,tsx}')."
      case_insensitive:
        type: "boolean"
        required: false
        default: true
        # 【中文】：是否忽略大小写（默认 true，默认不区分大小写；设为 false 开启精确大小写匹配）。
        description: "Case-insensitive matching (default: true; set false for exact case-sensitive matching)."
      max_results:
        type: "integer"
        required: false
        default: 200
        # 【中文】：最大匹配行数。
        description: "Maximum matching lines to return (default: 200)."
      context:
        type: "integer"
        required: false
        default: 0
        # 【中文】：匹配行附带的上下文行数。
        description: "Lines of context before and after each match (default: 0, max: 10)."

  - name: "run_command"
    category: "system"
    aliases: ["bash"]
    # 【中文】：在工作目录下执行终端命令并返回标准输出、标准错误和退出码；后台常驻进程（background=true）返回 PID 与监听端口。用于编译构建、测试、包管理、Git 操作、运行二进制与检查进程状态。不支持使用 && 串联多条命令（请使用分号 ; 隔开）。不可在此工具中调用 read、grep、glob 等文件工具。此终端不具备键盘交互输入，不支持分页器、REPL、tail -f 及需要按键确认的命令。
    description: "Execute a shell command and return stdout, stderr, and exit code. Background processes (background=true) return PID and listening port. Use for builds, tests, package management, Git operations, binaries, and process checks. Chaining commands with `&&` is not supported; use `;` instead. `read`, `grep`, `glob`, `ls`, `head`, `tail`, `sed`, `awk`, and `find` are not available in this shell tool. Shell pipelines and aggregation (such as wc, sort, uniq, git log) are supported. This shell has no keyboard input; pagers, REPLs, `tail -f`, and commands requiring keyboard interaction are not supported."
    parameters:
      command:
        type: "string"
        required: true
        # 【中文】：执行的命令行指令。
        description: "Command string to run."
      cwd:
        type: "string"
        required: false
        # 【中文】：可选的命令工作目录（相对工作区根路径或绝对路径）
        description: "Optional working directory for the command. Defaults to workspace root."
      shell:
        type: "string"
        required: false
        default: "default"
        # 【中文】：解释器：default | powershell | cmd (Windows)。
        description: "Optional interpreter override: default | powershell | cmd (Windows)."
      background:
        type: "boolean"
        required: false
        default: false
        # 【中文】：是否作为后台进程常驻运行（如 dev server），返回 PID 与端口
        description: "Run the command as a background process (e.g. resident services like dev servers). Returns PID and listening port."
      settle_secs:
        type: "integer"
        required: false
        default: 3
        # 【中文】：后台模式下的初始启动等待观察秒数（默认 3 秒）
        description: "Initial startup grace window in seconds when background=true (default: 3)."
      summary:
        type: "string"
        required: false
        # 【中文】：以用户提问的语言，一句话描述你当前运行此命令的目的。
        description: "One sentence in the language used by the user, describing the purpose of running this command."

  - name: "long_bash_keyword_actions"
    category: "system"
    # 【中文】：为长时间运行的命令注册或注销超时白名单关键字（如 cargo、npm、pytest），避免被视为空闲而终止。仅用于耗时较长的编译构建和测试命令。常驻服务或守护进程是不支持的。
    description: "Register or unregister timeout-whitelist keywords for long-running batch commands (such as `cargo`, `npm`, `pytest`) to avoid being terminated as idle. Use for lengthy compilation, builds, and test suites. Resident services and daemons are not supported."
    parameters:
      action:
        type: "string"
        required: true
        enum: ["add", "delete"]
        # 【中文】：执行操作：add（添加关键字）、delete（删除关键字）
        description: "Action to perform: 'add' to register a keyword, 'delete' to remove it."
      keyword:
        type: "string"
        required: true
        # 【中文】：命令前缀关键字词元（例如 'mvn', 'cargo', 'ninja'）
        description: "Command keyword token (e.g. 'mvn', 'cargo', 'ninja')."
      global:
        type: "boolean"
        required: false
        default: false
        # 【中文】：是否全局持久化到 config.toml（默认 false，仅当前会话生效）
        description: "Persist in config.toml for all future sessions (default false, current session only)."



  # ============================================================================
  # 二、代码智能核心 (Code Intelligence - 默认挂载)
  # ============================================================================
  - name: "code_explore"
    category: "codeintel"
    # 【中文】：通过语义代码图谱检索代码调用关系与业务流转，支持中英文自然语言查询。用于顺藤摸瓜排查业务关键词、注释或符号在全库中的流转，以及追踪调用链路、变量引用和逻辑脉络。
    description: "Retrieve code call relationships and business flows using a semantic code graph, supporting natural-language queries in Chinese and English. Use to trace how business keywords, comments, or symbols operate across the codebase, as well as tracking call chains, variable references, and logic flows."
    parameters:
      path:
        type: "string"
        required: true
        # 【中文】：搜索目标范围：支持工作区根目录 (".")、指定目录/模块、单个文件。
        description: "Scope path to search: workspace root ('.'), directory/module, or a specific file."
      query:
        type: "string"
        required: true
        # 【中文】：精确的符号名称或模糊的代码符号关键字，或中英文自然语言（如业务概念、领域术语、提问语句）。
        description: "Precise symbol name or fuzzy code symbol keyword, or natural language in Chinese or English (e.g. business concept, domain jargon, or question)."
      max_files:
        type: "integer"
        required: false
        default: 12
        maximum: 30
        # 【中文】：最多渲染源码片段的文件数量（默认 12，最大 30）
        description: "Maximum number of files to inspect (default: 12, max: 30)."
    guidance: "path can be the workspace root, a directory/module, or a target file; query is a symbol or Chinese/English keyword."

  # ============================================================================
  # 三、任务管理与交互 (Task & Interaction)
  # ============================================================================
  - name: "todo_write"
    category: "task"
    aliases: ["todowrite", "todo"]
    # 【中文】：为目标任务建立或维护结构化的多步骤清单，所有项完成后自动清空重置。用于规划任务、跟踪进度并提升交付质量。正式名 todo_write；todowrite / todo 为兼容别名。同一回合内多次调用会合并为一次 actions 批处理（非法混搭仍按顺序独立执行）。
    description: "Create or maintain a multi-step checklist for a task. Checklists are automatically cleared once all items are completed. Use to plan tasks, track progress, and improve delivery quality. Canonical name todo_write; todowrite/todo remain aliases. Same-turn calls coalesce into one actions batch when the mix is legal."
    parameters:
      actions:
        type: "array"
        required: true
        # 【中文】：填入每一项任务操作的数组对象。也可只传单条操作字段（无 actions 包装），运行时会归一成 actions。
        description: "Array of task action objects to apply in sequence. A single top-level action object is also accepted and normalized into actions."
        items:
          action:
            type: "string"
            required: false
            enum: ["add", "insert", "update", "delete", "clear"]
            # 【中文】：操作类型。字段能唯一决定操作时可省略：{content}→add，{content,position}→insert，{id,status|content}→update，{id}→delete。clear 必须显式写 action。
            description: "Optional when fields uniquely determine the op: {content}→add, {content,position}→insert, {id,status|content}→update, {id}→delete. Required for clear. Explicit value always wins."
          id:
            type: "integer"
            required: false
            # 【中文】：任务编号（从 1 开始；action 为 update、delete、remove 时必填；add、clear 时省略）
            description: "1-based task number (required for update, delete, remove; omit for add, clear)."
          position:
            type: "integer"
            required: false
            # 【中文】：插入位置（从 1 开始；仅 action 为 insert 时必填；其他操作省略）
            description: "1-based insert position (required for insert; omit for others)."
          status:
            type: "string"
            required: false
            enum: ["pending", "in_progress", "completed"]
            # 【中文】：任务状态（action 为 update 修改状态时必填；add 时选填，默认 pending；delete、clear 时省略）
            description: "Task status (required for update status change; optional for add, default pending; omit for delete, clear)."
          content:
            type: "string"
            required: false
            # 【中文】：任务描述文本（action 为 add、insert 时必填；update 改标题时选填；delete、clear 时省略）
            description: "Task description text (required for add, insert; optional for update title; omit for delete, clear)."

  - name: "request_user_input"
    category: "interaction"
    # 【中文】：弹出单选、多选或纯文本输入框以收集用户输入。用于信息不全、存在多种可行方案、缺失密钥/Token 或执行破坏性操作需用户确认时。向用户询问可自主决定的事项是不支持的。
    description: "Present a single-choice, multiple-choice, or text input prompt to collect user input. Use when information is insufficient, multiple approaches exist, secrets or tokens are needed, or destructive actions require confirmation. Inquiring about matters that can be determined autonomously is not supported."
    parameters:
      questions:
        type: "array"
        required: true
        # 【中文】：向用户展示的问题数组（1 到 4 个问题）
        description: "Array of 1 to 4 questions to present to the user."
        items:
          header:
            type: "string"
            required: true
            # 【中文】：分类标题（几个字）
            description: "Very short label (a few words)."
          question:
            type: "string"
            required: true
            # 【中文】：清晰提问单句
            description: "One clear sentence, ideally ending in '?'."
          mode:
            type: "string"
            required: true
            enum: ["single", "multiple", "text"]
            # 【中文】：交互模式：单选、多选或文本
            description: "Input mode: single, multiple, or text."
          options:
            type: "array"
            required: false
            # 【中文】：选项列表（单选/多选时提供；纯文本模式省略）
            description: "Choices for single/multiple; omit for text. JSON array of {label, description}."

  - name: "memory"
    category: "memory"
    # 【中文】：持久化存储用户跨会话的记忆事实、编码偏好或环境配置。当用户明确要求记住某个偏好、习惯、约定，或需要持久化重要上下文事实时触发。
    description: "Persist durable notes and preferences across sessions."
    parameters:
      action:
        type: "string"
        required: true
        enum: ["remember", "forget", "list"]
      content:
        type: "string"
        required: false
        description: "Note content."

  - name: "task"
    category: "subagent"
    # 【中文】：派发子代理执行独立的子任务。explore 为只读探查，worker 可修改文件且必须声明 scope 限定写入范围。用于复杂探索和适合独立推进的并行任务。
    description: "Dispatch subagents to execute isolated subtasks. `explore` is read-only for research and findings; `worker` can edit files and must declare a `scope` to restrict write access. Use for complex exploration and parallel tasks that benefit from independent execution."
    parameters:
      tasks:
        type: "array"
        required: true
        description: "JSON array of subtasks."
        items:
          description:
            type: "string"
            required: true
          prompt:
            type: "string"
            required: true
          subagent_type:
            type: "string"
            required: true
            enum: ["explore", "worker"]
          scope:
            type: "array"
            required: false
            description: "Worker-only write globs, JSON string array (e.g. [\"src/auth/**\"]). Required for worker."

  - name: "code_review"
    category: "subagent"
    # 【中文】：对工作区或 Git 变更执行只读代码评审，按正确性、安全性、可靠性排序风险。用于合并前检查或提交前的自检。
    description: "Run a read-only review of workspace or Git changes, ranking risks by correctness, security, and reliability. Use for pre-merge inspection or pre-commit self-checks."
    parameters:
      scope:
        type: "string"
        required: false
        description: "Review target."

  - name: "fetch_output"
    category: "utility"
    # 【中文】：分片获取之前被截断的工具输出内容。用于前序工具输出末尾带有 artifact_id 截断标记时获取剩余内容。
    description: "Fetch remaining chunks of truncated tool output. Use when a previous tool result ends with an `artifact_id` truncation marker."
    parameters:
      artifact_id:
        type: "string"
        required: true
        description: "Artifact ID."

  - name: "jeikcode_config"
    category: "utility"
    aliases: ["jeikcode_config_guide", "jeikcode_config_reload"]
    # 【中文】：JeikCode 全局与工作区配置管理工具。支持查阅各模块配置指南（action="guide"），或在当前会话中主动热重载配置（action="reload"），无需重启进程。
    description: "Manage JeikCode configuration: query guide documents or hot-reload all configurations in the active session. Querying currently mounted MCP servers or skills is not supported as they are already available in the context."
    parameters:
      action:
        type: "string"
        required: false
        default: "guide"
        enum: ["guide", "reload"]
        # 【中文】：执行操作：guide（查询配置文档）、reload（在当前会话中热重载配置）
        description: "Action to perform: 'guide' to query configuration documents, or 'reload' to hot-reload all configurations in the active session."
      topic:
        type: "string"
        required: false
        default: "overview"
        enum: ["overview", "prompts", "models", "providers", "mcp", "skills", "thesaurus", "cilin", "tools", "timeouts", "directories", "files", "project", "constraints", "rules", "updates", "upgrade", "release", "all"]
        # 【中文】：待检索的主题分类（仅当 action="guide" 时有效）
        description: "Category of configuration guide to retrieve (for action='guide'): 'overview', 'prompts', 'models', 'providers', 'mcp', 'skills', 'thesaurus', 'tools', 'directories', 'project', 'updates', or 'all'."

  # ============================================================================
  # 四、网络与技能 (Web & Skills)
  # ============================================================================
  - name: "web_fetch"
    category: "web"
    # 【中文】：通过 HTTP/HTTPS 抓取网页并提取转换为 Markdown 格式。用于获取用户提供链接的网页内容或查看网络搜索结果中的页面。
    description: "Fetch an HTTP/HTTPS webpage and convert its content to Markdown. Use to retrieve documentation or pages from user-provided URLs or search results."
    parameters:
      url:
        type: "string"
        required: true
        # 【中文】：待抓取的网页完整 URL 地址（须为 http 或 https 协议）
        description: "Fully-qualified HTTP or HTTPS URL to fetch."

  - name: "web_search"
    category: "web"
    # 【中文】：搜索互联网公开信息并返回标题、网址与摘要。用于查阅外部技术文档、第三方依赖问题或最新资讯。通过本地代码和文档可解决的问题，联网搜索是不支持的。
    description: "Search the web and return titles, URLs, and snippets. Use to consult technical documentation, external dependency issues, or recent information. Searching the web for issues resolvable via local code and docs is not supported."
    parameters:
      query:
        type: "string"
        required: true
        # 【中文】：搜索查询语句或关键词
        description: "Search query string."
      max_results:
        type: "integer"
        required: false
        default: 8
        # 【中文】：最大搜索返回条数（默认 8，最大 20）
        description: "Maximum number of search results to return (default: 8, max: 20)."

  - name: "use_skill"
    category: "skill"
    # 【中文】：执行已安装的指定技能。
    description: "Execute an installed skill by name."
    parameters:
      name:
        type: "string"
        required: true
        description: "Skill name from AVAILABLE SKILLS."

  - name: "list_skills"
    category: "skill"
    # 【中文】：列出已安装的全部技能。
    description: "List all installed skills."
    parameters: {}
