[workspace]

[package]
name = "jeikcode-desktop"
version = "7.2.0-beta.6"
edition = "2021"
description = "JeikCode desktop shell"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
