name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-webui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package.json

      - name: Build WebUI
        run: |
          cd webui
          npm install
          npm run build

      - name: Upload WebUI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/
          if-no-files-found: error

  build-macos:
    needs: [build-webui]
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Build ARM64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Prepare binaries
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/jeikcode dist/jeikcode-${TAG_NAME}-darwin-arm64
          cp target/x86_64-apple-darwin/release/jeikcode dist/jeikcode-${TAG_NAME}-darwin-x64
          chmod +x dist/*

      - name: Strip binaries
        run: |
          strip dist/* || true

      - name: Release macOS Binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: [build-webui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation tools
        run: |
          pip install cargo-zigbuild ziglang

      - name: Add Linux targets
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl

      - name: Build x86_64
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl

      - name: Build ARM64
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl

      - name: Prepare binaries
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/jeikcode dist/jeikcode-${TAG_NAME}-linux-x64
          cp target/aarch64-unknown-linux-musl/release/jeikcode dist/jeikcode-${TAG_NAME}-linux-arm64
          chmod +x dist/*

      - name: Strip binaries
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          strip dist/jeikcode-${TAG_NAME}-linux-x64 || true
          strip dist/jeikcode-${TAG_NAME}-linux-arm64 || true

      - name: Release Linux Binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: [build-webui]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Windows targets
        run: |
          rustup target add aarch64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc

      - name: Build ARM64
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Build x86_64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare binaries
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-pc-windows-msvc/release/jeikcode.exe dist/jeikcode-${TAG_NAME}-windows-arm64.exe
          cp target/x86_64-pc-windows-msvc/release/jeikcode.exe dist/jeikcode-${TAG_NAME}-windows-x64.exe

      - name: Release Windows Binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  distro-pm-check:
    needs: [build-webui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build with distro-pm feature
        run: cargo build -p jeikcode --features distro-pm

      - name: Test distro-pm gating
        run: cargo test -p jeikcode-updater --lib --features distro-pm
