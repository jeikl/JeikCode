name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# 自动抢占与防重：每个 Tag 独立独占运行，新提交自动取消同 Tag 的旧流水线
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # --- 前置门禁：严格检查当前版本是否大于上一个发布版本，不大于则直接终止流水线 ---
  check-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check version gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/check-version-gate.js "$TAG_NAME" "$REPO"

  build-webui:
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: webui/package-lock.json

      # WebUI 侧栏版本号在 `vite build` 时从 Cargo.toml / JEIKCODE_VERSION 烘进 JS。
      # Rust job 的 Tag 注入发生在本步之后，这里必须先注入，否则发布品侧栏会止步于工作区里的旧 version。
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml + JEIKCODE_VERSION to $VERSION from tag $TAG_NAME ..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "JEIKCODE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build WebUI
        run: |
          cd webui
          npm ci
          npm run build

      - name: Upload WebUI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/
          if-no-files-found: error

  # --- Windows 构建：x86_64 与 ARM64 矩阵并行编译 ---
  build-windows:
    needs: [build-webui]
    if: always() && needs.build-webui.result == 'success'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 自动从 Git Tag 注入版本号到 Cargo.toml（无需手动改）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Build Windows ${{ matrix.arch }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare Windows ${{ matrix.arch }} binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/jeikcode.exe dist/jeikcode-${TAG_NAME}-windows-${{ matrix.arch }}.exe

      - name: Upload Windows CLI artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows-${{ matrix.arch }}
          path: dist/jeikcode-*
          if-no-files-found: error

  # --- Linux 构建：x86_64 与 ARM64 矩阵并行编译 ---
  build-linux:
    needs: [build-webui]
    if: always() && needs.build-webui.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        run: |
          pip install cargo-zigbuild==0.23.4 ziglang==0.16.0

      # 自动从 Git Tag 注入版本号到 Cargo.toml（无需手动改）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Build Linux ${{ matrix.arch }}
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Require 16K page alignment
        if: matrix.arch == 'arm64'
        run: |
          python3 - <<'PY'
          import struct, pathlib, sys
          p = pathlib.Path("target/aarch64-unknown-linux-musl/release/jeikcode")
          data = p.read_bytes()
          if data[:4] != b"\x7fELF":
              sys.exit("not an ELF binary")
          e_phoff = struct.unpack_from("<Q", data, 32)[0]
          e_phentsize = struct.unpack_from("<H", data, 54)[0]
          e_phnum = struct.unpack_from("<H", data, 56)[0]
          aligns = []
          for i in range(e_phnum):
              off = e_phoff + i * e_phentsize
              p_type = struct.unpack_from("<I", data, off)[0]
              p_align = struct.unpack_from("<Q", data, off + 48)[0]
              if p_type == 1:
                  aligns.append(p_align)
          print("PT_LOAD align", [hex(a) for a in aligns])
          if not aligns or min(aligns) < 16384:
              sys.exit("aarch64 musl binary is not 16K-page compatible")
          PY

      - name: Prepare and Strip Linux ${{ matrix.arch }} binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/jeikcode dist/jeikcode-${TAG_NAME}-linux-${{ matrix.arch }}
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-linux-${{ matrix.arch }} || true

      - name: Upload Linux CLI artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: dist/jeikcode-*
          if-no-files-found: error

  # --- macOS 构建：x86_64 与 ARM64 矩阵并行编译 ---
  build-macos:
    needs: [build-webui]
    if: always() && needs.build-webui.result == 'success'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x64
          - target: aarch64-apple-darwin
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 自动从 Git Tag 注入版本号到 Cargo.toml（兼容 macOS BSD sed）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Build macOS ${{ matrix.arch }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare and Strip macOS ${{ matrix.arch }} binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/jeikcode dist/jeikcode-${TAG_NAME}-darwin-${{ matrix.arch }}
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-darwin-${{ matrix.arch }} || true

      - name: Upload macOS CLI artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: cli-macos-${{ matrix.arch }}
          path: dist/jeikcode-*
          if-no-files-found: error

  # 六个 CLI 都齐之后创建一次 Release。清单是 Release 资产，不回写 main。
  publish:
    name: Publish release
    needs: [build-windows, build-linux, build-macos, distro-pm-check, rust-quality]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release source revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF")" = "$GITHUB_SHA"

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Write manifest, changelog, and release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/publish-release.js --tag "$TAG_NAME" --dist dist --root .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JeikCode ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            dist/jeikcode-*
            dist/latest.json
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 桌面安装包。壳只打开本机 WebUI，并把同一个 jeikcode 拷进 ~/.local/bin。
  # 失败不挡住上面的 CLI Release。
  desktop:
    name: Desktop ${{ matrix.os }} ${{ matrix.bundles }}
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cli-windows-x64
            cli: jeikcode-${{ github.ref_name }}-windows-x64.exe
            bundles: nsis
            rust_target: ""
          - os: macos-latest
            artifact: cli-macos-arm64
            cli: jeikcode-${{ github.ref_name }}-darwin-arm64
            bundles: dmg
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            artifact: cli-macos-x64
            cli: jeikcode-${{ github.ref_name }}-darwin-x64
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - os: ubuntu-22.04
            artifact: cli-linux-x64
            cli: jeikcode-${{ github.ref_name }}-linux-x64
            bundles: deb,appimage,rpm
            rust_target: ""
          - os: ubuntu-24.04-arm
            artifact: cli-linux-arm64
            cli: jeikcode-${{ github.ref_name }}-linux-arm64
            bundles: deb,appimage
            rust_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux WebKit
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-${{ matrix.os }}-${{ matrix.rust_target || 'default' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Download CLI
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cli-dist

      - name: Stage CLI into the desktop bundle
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources
          cp "cli-dist/${{ matrix.cli }}" desktop/src-tauri/resources/cli-bin
          chmod +x desktop/src-tauri/resources/cli-bin || true

      - name: Sync desktop version from the tag
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          if command -v python3 >/dev/null; then PY=python3; else PY=python; fi
          "$PY" - <<'PY'
          import json, os, pathlib, re
          ver = os.environ["VER"]
          if ver.startswith("v"):
              ver = ver[1:]
          conf = pathlib.Path("desktop/src-tauri/tauri.conf.json")
          data = json.loads(conf.read_text())
          data["version"] = ver
          conf.write_text(json.dumps(data, indent=2) + "\n")
          cargo = pathlib.Path("desktop/src-tauri/Cargo.toml")
          text = cargo.read_text()
          text = re.sub(r'(?m)^version = ".*"', f'version = "{ver}"', text, count=1)
          cargo.write_text(text)
          PY

      - name: Build desktop installers
        working-directory: desktop
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.rust_target != '' && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload desktop installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Linux distro-pm 包管理工具兼容性测试门禁 ---
  distro-pm-check:
    needs: [build-webui]
    if: always() && needs.build-webui.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: distro-pm-check

      - name: Build with distro-pm feature
        run: cargo build -p jeikcode --features distro-pm --locked

      - name: Test distro-pm gating
        run: cargo test -p jeikcode-updater --lib --features distro-pm --locked

  rust-quality:
    name: Rust quality
    needs: [build-webui]
    if: always() && needs.build-webui.result == 'success'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-quality
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Test read tool integrity & capabilities
        run: "cargo test -p jeikcode-capabilities --lib tools::read:: --locked"
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Verify embedded WebUI
        run: "cargo test -p jeikcode-daemon --lib webui::tests:: --locked"
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
