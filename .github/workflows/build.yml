name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 自动抢占与防重：全局只允许最新的发版流水线独占运行，新提交自动取消所有旧的/排队中的流水线
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || 'release' }}
  cancel-in-progress: true

jobs:
  # --- 前置门禁：严格检查当前版本是否大于上一个发布版本，不大于则直接终止流水线 ---
  check-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/check-version-gate.js "$TAG_NAME" "$REPO"

  build-webui:
    needs: [check-version]
    if: |
      always() &&
      (needs.check-version.result == 'success' || !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package.json

      # WebUI 侧栏版本号在 `vite build` 时从 Cargo.toml / JEIKCODE_VERSION 烘进 JS。
      # Rust job 的 Tag 注入发生在本步之后，这里必须先注入，否则发布品侧栏会止步于工作区里的旧 version。
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml + JEIKCODE_VERSION to $VERSION from tag $TAG_NAME ..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "JEIKCODE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build WebUI
        run: |
          cd webui
          npm install
          npm run build

      - name: Upload WebUI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist/
          if-no-files-found: error

  # --- Windows 构建：优先放置且 x86_64 优先编译发布 ---
  build-windows:
    needs: [build-webui]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Windows targets (x86_64 first)
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup target add aarch64-pc-windows-msvc

      # 自动从 Git Tag 注入版本号到 Cargo.toml（无需手动改）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # 1. 优先编译 Windows x86_64
      - name: Build Windows x86_64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Windows x86_64 binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/jeikcode.exe dist/jeikcode-${TAG_NAME}-windows-x64.exe

      # 2. Windows ARM64。两个架构一起交给 publish，不在这里创建 Release、也不提交。
      - name: Build Windows ARM64
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Prepare Windows ARM64 binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-pc-windows-msvc/release/jeikcode.exe dist/jeikcode-${TAG_NAME}-windows-arm64.exe

      - name: Upload Windows CLI artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: dist/jeikcode-*
          if-no-files-found: error

  # --- Linux 构建：x86_64 优先编译发布 ---
  build-linux:
    needs: [build-webui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation tools
        run: |
          pip install cargo-zigbuild ziglang

      - name: Add Linux targets (x86_64 first)
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl

      # 自动从 Git Tag 注入版本号到 Cargo.toml（无需手动改）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # 1. 优先编译 Linux x86_64
      - name: Build Linux x86_64
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl

      - name: Prepare and Strip Linux x86_64 binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/jeikcode dist/jeikcode-${TAG_NAME}-linux-x64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-linux-x64 || true

      # 2. Linux ARM64。与 x64 一起交给 publish。
      # 页大小由 .cargo/config.toml 的 max-page-size=16384 保证，4K 与 16K 内核都能跑。
      - name: Build Linux ARM64
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl

      - name: Require 16K page alignment
        run: |
          python3 - <<'PY'
          import struct, pathlib, sys
          p = pathlib.Path("target/aarch64-unknown-linux-musl/release/jeikcode")
          data = p.read_bytes()
          if data[:4] != b"\x7fELF":
              sys.exit("not an ELF binary")
          e_phoff = struct.unpack_from("<Q", data, 32)[0]
          e_phentsize = struct.unpack_from("<H", data, 54)[0]
          e_phnum = struct.unpack_from("<H", data, 56)[0]
          aligns = []
          for i in range(e_phnum):
              off = e_phoff + i * e_phentsize
              p_type = struct.unpack_from("<I", data, off)[0]
              p_align = struct.unpack_from("<Q", data, off + 48)[0]
              if p_type == 1:
                  aligns.append(p_align)
          print("PT_LOAD align", [hex(a) for a in aligns])
          if not aligns or min(aligns) < 16384:
              sys.exit("aarch64 musl binary is not 16K-page compatible")
          PY

      - name: Prepare and Strip Linux ARM64 binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/jeikcode dist/jeikcode-${TAG_NAME}-linux-arm64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-linux-arm64 || true

      - name: Upload Linux CLI artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: dist/jeikcode-*
          if-no-files-found: error

  # --- macOS 构建：x86_64 优先编译发布 ---
  build-macos:
    needs: [build-webui]
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets (x86_64 first)
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      # 自动从 Git Tag 注入版本号到 Cargo.toml（兼容 macOS BSD sed）
      - name: Sync version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "Syncing Cargo.toml workspace version to $VERSION from tag $TAG_NAME ..."
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      # 1. 优先编译 macOS x86_64 (Intel)
      - name: Build macOS x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Prepare and Strip macOS x86_64 binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/jeikcode dist/jeikcode-${TAG_NAME}-darwin-x64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-darwin-x64 || true

      # 2. macOS ARM64。与 x64 一起交给 publish。
      - name: Build macOS ARM64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Prepare and Strip macOS ARM64 binary
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/jeikcode dist/jeikcode-${TAG_NAME}-darwin-arm64
          chmod +x dist/*
          strip dist/jeikcode-${TAG_NAME}-darwin-arm64 || true

      - name: Upload macOS CLI artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: cli-macos
          path: dist/jeikcode-*
          if-no-files-found: error

  # 六个 CLI 都齐之后创建一次 Release。清单是 Release 资产，不回写 main。
  publish:
    name: Publish release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write manifest, changelog, and release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/publish-release.js --tag "$TAG_NAME" --dist dist --root .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: JeikCode ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/jeikcode-*
            dist/latest.json
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 桌面安装包。壳只打开本机 WebUI，并把同一个 jeikcode 拷进 ~/.local/bin。
  # 失败不挡住上面的 CLI Release。
  desktop:
    name: Desktop ${{ matrix.os }} ${{ matrix.bundles }}
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cli-windows
            cli: jeikcode-${{ github.ref_name }}-windows-x64.exe
            bundles: nsis
            rust_target: ""
          - os: macos-latest
            artifact: cli-macos
            cli: jeikcode-${{ github.ref_name }}-darwin-arm64
            bundles: dmg
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            artifact: cli-macos
            cli: jeikcode-${{ github.ref_name }}-darwin-x64
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - os: ubuntu-22.04
            artifact: cli-linux
            cli: jeikcode-${{ github.ref_name }}-linux-x64
            bundles: deb,appimage,rpm
            rust_target: ""
          - os: ubuntu-24.04-arm
            artifact: cli-linux
            cli: jeikcode-${{ github.ref_name }}-linux-arm64
            bundles: deb,appimage
            rust_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux WebKit
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Download CLI
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cli-dist

      - name: Stage CLI into the desktop bundle
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources
          cp "cli-dist/${{ matrix.cli }}" desktop/src-tauri/resources/cli-bin
          chmod +x desktop/src-tauri/resources/cli-bin || true

      - name: Sync desktop version from the tag
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          if command -v python3 >/dev/null; then PY=python3; else PY=python; fi
          "$PY" - <<'PY'
          import json, os, pathlib, re
          ver = os.environ["VER"]
          if ver.startswith("v"):
              ver = ver[1:]
          conf = pathlib.Path("desktop/src-tauri/tauri.conf.json")
          data = json.loads(conf.read_text())
          data["version"] = ver
          conf.write_text(json.dumps(data, indent=2) + "\n")
          cargo = pathlib.Path("desktop/src-tauri/Cargo.toml")
          text = cargo.read_text()
          text = re.sub(r'(?m)^version = ".*"', f'version = "{ver}"', text, count=1)
          cargo.write_text(text)
          PY

      - name: Build desktop installers
        working-directory: desktop
        run: |
          npm install
          npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.rust_target != '' && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload desktop installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Linux distro-pm 包管理工具兼容性测试门禁 ---
  distro-pm-check:
    needs: [build-webui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build with distro-pm feature
        run: cargo build -p jeikcode --features distro-pm

      - name: Test distro-pm gating
        run: cargo test -p jeikcode-updater --lib --features distro-pm
