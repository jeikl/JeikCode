name: Deploy VitePress Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# 赋予部署 GitHub Pages 必需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 保证部署互斥与顺序
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: docs-site

      - name: Sync latest version into documentation
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)
          CLEAN_VER="${TAG#v}"
          if [ -n "$CLEAN_VER" ]; then
            echo "Injecting latest version v${CLEAN_VER} into docs..."
            sed -i "s/const version = ref('v.*')/const version = ref('v${CLEAN_VER}')/" docs-site/.vitepress/theme/HeroImageWithVersion.vue || true
            sed -i "s/const version = 'v.*'/const version = 'v${CLEAN_VER}'/" docs-site/.vitepress/theme/HeroImageWithVersion.vue || true
          fi

      - name: Build documentation with VitePress
        run: npm run docs:build
        working-directory: docs-site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
