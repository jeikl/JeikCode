name: CI

on:
  pull_request:
    branches: [main, beta]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - '.vscode/**'
      - 'LICENSE*'
  push:
    branches: [main, beta]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - '.vscode/**'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  repo-consistency:
    name: Repository consistency
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Version consistency
        run: node scripts/check-version-consistency.js
      - name: Platform manifest consistency
        run: node scripts/platforms.js --check
      - name: Script unit tests
        run: node --test scripts/platforms.test.js scripts/publish-release.test.js scripts/bump-version.test.js
      - name: Docs parity (English source)
        run: node scripts/check-docs-parity.js

  installer-integrity:
    name: Installer integrity (${{ matrix.os }})
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Mapping is exercised on x64 with the installer's test-only uname
        # override; real arm64 runtime is covered by headless-arm64 below.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Verify installer fail-closed behavior
        run: python scripts/test_installers.py

  webui-quality:
    name: WebUI quality
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install locked WebUI dependencies
        working-directory: webui
        run: npm ci
      - name: Audit WebUI dependencies
        working-directory: webui
        run: npm audit --audit-level=high
      - name: Typecheck WebUI
        working-directory: webui
        run: npm run typecheck
      - name: Test WebUI
        working-directory: webui
        run: npm test
      - name: Build WebUI
        working-directory: webui
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ci-webui-dist
          path: webui/dist/
          if-no-files-found: error

  rust-quality:
    name: Rust quality
    needs: webui-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ci-webui-dist
          path: webui/dist
      # Keep in sync with rust-toolchain.toml: fmt needs rustfmt on the SAME
      # pinned channel, otherwise `@stable` installs it for a different one.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt
      - name: Check Rust code formatting
        run: cargo fmt --all --check
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-rust-quality"
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Test config lib (project key contract)
        run: cargo test -p jeikcode-config --lib --locked
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Test updater distribution gates
        run: cargo test -p jeikcode-updater --lib --features distro-pm --locked
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Test read tool integrity & capabilities
        run: "cargo test -p jeikcode-capabilities --lib tools::read:: --locked"
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Smoke persisted catalog timestamp units
        shell: bash
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
          JEIKCODE_CATALOG_SMOKE_ROOT: ${{ runner.temp }}/catalog-timestamp-smoke
        run: |
          set -euo pipefail
          smoke=crates/jeikcode-capabilities/examples/__catalog_timestamp_smoke.rs
          mkdir -p "$(dirname "$smoke")"
          trap 'rm -f "$smoke"' EXIT
          cat > "$smoke" <<'RS'
          use jeikcode_capabilities::session::{SessionManager, SessionMeta};
          use std::{fs, path::PathBuf};

          fn main() {
              let root = PathBuf::from(std::env::var_os("JEIKCODE_CATALOG_SMOKE_ROOT").unwrap());
              let bucket = root.join("0123456789abcdef");
              let manager = SessionManager::with_root(&bucket);
              let mut both = SessionMeta::new("both", "/native", 2_000);
              both.updated_at = 4_000;
              manager.write_meta(&both).unwrap();
              manager.write_meta(&SessionMeta::new("native", "/native-only", 1_000)).unwrap();
              for (id, updated) in [("both", 3), ("legacy", 2)] {
                  let legacy = serde_json::json!({
                      "id": id, "name": id, "working_dir": "/legacy",
                      "created_at": 1, "updated_at": updated, "messages": []
                  });
                  fs::write(bucket.join(format!("{id}.json")), serde_json::to_vec(&legacy).unwrap()).unwrap();
              }
              let scan = SessionManager::scan_catalog(&root);
              assert!(scan.diagnostics.is_empty(), "{:?}", scan.diagnostics);
              assert_eq!(scan.latest().unwrap().id, "both");
              for (id, created, updated) in [("both", 2_000, 4_000), ("native", 1_000, 1_000), ("legacy", 1_000, 2_000)] {
                  let entry = scan.entries.iter().find(|entry| entry.id == id).unwrap();
                  assert_eq!((entry.created_at_ms, entry.updated_at_ms), (created, updated), "{id}");
                  println!("catalog smoke: {id} created_at_ms={} updated_at_ms={}", entry.created_at_ms, entry.updated_at_ms);
              }
              fs::remove_dir_all(root).unwrap();
          }
          RS
          cargo run --quiet --locked -p jeikcode-capabilities --features session --example __catalog_timestamp_smoke
          cargo test --locked -p jeikcode-capabilities --features session --lib session::manager::tests::catalog_scan_merges_physical_sources_and_keeps_diagnostics -- --exact
      - name: Test capabilities integration suite
        run: cargo test -p jeikcode-capabilities --test tools_integration --test http_mock --test anthropic_mock --test ollama_mock --test compaction_cache --test session_fixture_invariants --locked
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Verify embedded WebUI
        run: "cargo test -p jeikcode-daemon --lib webui::tests:: --locked"
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Test TUI library contracts
        run: cargo test --locked -p jeikcode-tuix --lib -- --test-threads=1
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      # PR 保持快速；push 才跑这些较重的 lib 套件。
      # 覆盖此前 CI 从不执行的 daemon/cli/review/telemetry 用例，
      # 以及 Rewind gate、steer drain 等运行时契约。
      - name: Test full lib suites (push)
        if: github.event_name != 'pull_request'
        run: cargo test --locked -p jeikcode-coding -p jeikcode-kernel -p jeikcode-daemon -p jeikcode -p jeikcode-review -p jeikcode-telemetry --lib
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home

  # 真实 arm64 安装器测试。PR 上跳过以保持反馈速度；
  # push/dispatch 在原生 arm64 上验证 linux-arm64 产物下载与校验。
  installer-integrity-arm64:
    name: Installer integrity (arm64)
    if: "!startsWith(github.event.head_commit.message, 'chore(release):') && github.event_name != 'pull_request'"
    runs-on: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Verify installer on native arm64
        run: python scripts/test_installers.py

  # 真实 arm64 Linux 原生 lib 测试 + 运行时冒烟。PR 上跳过以保持反馈速度；
  # push/dispatch 跑一次，覆盖发布前 qemu 之外的原生环境。
  headless-arm64:
    name: Native arm64 tests + smoke
    # push 常跑；workflow_dispatch 可手动验证 runner 是否可用。
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: webui-quality
    # GitHub-hosted arm64 Linux runner label; override with repo variable
    # ARM64_RUNNER if the plan does not expose it (e.g. a self-hosted label).
    runs-on: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-webui-dist
          path: webui/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "headless-arm64"
      # 原生 arm64 跑全部 lib 测试；比 qemu 更能暴露指令集/页大小/原子性问题。
      - name: Native arm64 library tests
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
        run: cargo test --locked --workspace --lib --no-fail-fast
      - name: Build headless CLI
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
        run: cargo build --locked -p jeikcode
      - name: Smoke --version + serve /health
        shell: bash
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
        run: |
          set -euo pipefail
          BIN=target/debug/jeikcode
          "$BIN" --version
          "$BIN" --host 127.0.0.1 --port 38473 --dir "$PWD" --no-token --no-telemetry &
          pid=$!
          for _ in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:38473/health; then
              curl -fsS -o /dev/null http://127.0.0.1:38473/
              echo "headless arm64 smoke OK"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          echo "headless arm64: /health never became ready" >&2
          exit 1
