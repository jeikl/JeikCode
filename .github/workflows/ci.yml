name: CI

on:
  pull_request:
    branches: [main, beta]
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  version-consistency:
    name: Version consistency
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/check-version-consistency.js

  installer-integrity:
    name: Installer integrity (${{ matrix.os }})
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify installer fail-closed behavior
        run: python scripts/test_installers.py

  webui-quality:
    name: WebUI quality
    needs: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install locked WebUI dependencies
        working-directory: webui
        run: npm ci
      - name: Audit WebUI dependencies
        working-directory: webui
        run: npm audit --audit-level=high
      - name: Typecheck WebUI
        working-directory: webui
        run: npm run typecheck
      - name: Test WebUI
        working-directory: webui
        run: npm test
      - name: Build WebUI
        working-directory: webui
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ci-webui-dist
          path: webui/dist/
          if-no-files-found: error

  rust-quality:
    name: Rust quality
    needs: webui-quality
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ci-webui-dist
          path: webui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Test updater distribution gates
        run: cargo test -p jeikcode-updater --lib --features distro-pm --locked
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Test read tool integrity & capabilities
        run: "cargo test -p jeikcode-capabilities --lib tools::read:: --locked"
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Smoke persisted catalog timestamp units
        shell: bash
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
          JEIKCODE_CATALOG_SMOKE_ROOT: ${{ runner.temp }}/catalog-timestamp-smoke
        run: |
          set -euo pipefail
          smoke=crates/jeikcode-capabilities/examples/__catalog_timestamp_smoke.rs
          mkdir -p "$(dirname "$smoke")"
          trap 'rm -f "$smoke"' EXIT
          cat > "$smoke" <<'RS'
          use jeikcode_capabilities::session::{SessionManager, SessionMeta};
          use std::{fs, path::PathBuf};

          fn main() {
              let root = PathBuf::from(std::env::var_os("JEIKCODE_CATALOG_SMOKE_ROOT").unwrap());
              let bucket = root.join("0123456789abcdef");
              let manager = SessionManager::with_root(&bucket);
              let mut both = SessionMeta::new("both", "/native", 2_000);
              both.updated_at = 4_000;
              manager.write_meta(&both).unwrap();
              manager.write_meta(&SessionMeta::new("native", "/native-only", 1_000)).unwrap();
              for (id, updated) in [("both", 3), ("legacy", 2)] {
                  let legacy = serde_json::json!({
                      "id": id, "name": id, "working_dir": "/legacy",
                      "created_at": 1, "updated_at": updated, "messages": []
                  });
                  fs::write(bucket.join(format!("{id}.json")), serde_json::to_vec(&legacy).unwrap()).unwrap();
              }
              let scan = SessionManager::scan_catalog(&root);
              assert!(scan.diagnostics.is_empty(), "{:?}", scan.diagnostics);
              assert_eq!(scan.latest().unwrap().id, "both");
              for (id, created, updated) in [("both", 2_000, 4_000), ("native", 1_000, 1_000), ("legacy", 1_000, 2_000)] {
                  let entry = scan.entries.iter().find(|entry| entry.id == id).unwrap();
                  assert_eq!((entry.created_at_ms, entry.updated_at_ms), (created, updated), "{id}");
                  println!("catalog smoke: {id} created_at_ms={} updated_at_ms={}", entry.created_at_ms, entry.updated_at_ms);
              }
              fs::remove_dir_all(root).unwrap();
          }
          RS
          cargo run --quiet --locked -p jeikcode-capabilities --features session --example __catalog_timestamp_smoke
          cargo test --locked -p jeikcode-capabilities --features session --lib session::manager::tests::catalog_scan_merges_physical_sources_and_keeps_diagnostics -- --exact
      - name: Test capabilities integration suite
        run: cargo test -p jeikcode-capabilities --test tools_integration --test http_mock --test anthropic_mock --test ollama_mock --test compaction_cache --test session_fixture_invariants --locked
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Verify embedded WebUI
        run: "cargo test -p jeikcode-daemon --lib webui::tests:: --locked"
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
      - name: Test TUI library contracts
        run: cargo test --locked -p jeikcode-tuix --lib -- --test-threads=1
        env:
          JEIKCODE_HOME: ${{ runner.temp }}/jeikcode-home
