name: CI

on:
  pull_request:
    branches: [main, beta]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      # desktop/src-tauri 不在 workspace members 内；桌面打包由
      # beta-desktop-x64.yml / build.yml 负责，代码 push 不必跑 Rust 套件。
      - 'desktop/**'
      - '.vscode/**'
      - 'LICENSE*'
  push:
    branches: [main, beta]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'desktop/**'
      - '.vscode/**'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  repo-consistency:
    name: Repository consistency
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Version consistency
        run: node scripts/check-version-consistency.js
      - name: Platform manifest consistency
        run: node scripts/platforms.js --check
      - name: Script unit tests
        run: node --test scripts/platforms.test.js scripts/publish-release.test.js scripts/bump-version.test.js
      - name: Docs parity (English source)
        run: node scripts/check-docs-parity.js

  installer-integrity:
    name: Installer integrity (${{ matrix.os }})
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Mapping is exercised on x64 with the installer's test-only uname
        # override; real arm64 runtime is covered by headless-arm64 below.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Verify installer fail-closed behavior
        run: python scripts/test_installers.py

  webui-quality:
    name: WebUI quality
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install locked WebUI dependencies
        working-directory: webui
        run: npm ci
      - name: Audit WebUI dependencies
        working-directory: webui
        run: npm audit --audit-level=high
      - name: Typecheck WebUI
        working-directory: webui
        run: npm run typecheck
      - name: Test WebUI
        working-directory: webui
        run: npm test
      - name: Build WebUI
        working-directory: webui
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ci-webui-dist
          path: webui/dist/
          if-no-files-found: error
          # 产物只服务同一次 run 的 daemon/arm64 测试。
          retention-days: 1

  # Rust 静态检查 + 契约测试：不依赖 WebUI 产物，与 webui-quality 并行。
  # TUI 只在 PR/手动事件跑；push 已由 portability（win/mac，serial）与 arm64 覆盖。
  rust-static-contracts:
    name: Rust static + contracts
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Isolate runtime home
        shell: bash
        run: echo "JEIKCODE_HOME=$RUNNER_TEMP/jeikcode-home" >> "$GITHUB_ENV"
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # fmt 需要 rustfmt 安装在 rust-toolchain.toml 指定的同一个 channel 上。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - name: Check Rust code formatting
        run: cargo fmt --all --check
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-rust-contracts"
          save-if: ${{ github.event_name == 'push' }}
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets --locked
      - name: Test config lib (project key contract)
        run: cargo test -p jeikcode-config --lib --locked
      - name: Test updater distribution gates
        run: cargo test -p jeikcode-updater --lib --features distro-pm --locked
      - name: Test capabilities integration suite
        run: cargo test -p jeikcode-capabilities --test tools_integration --test http_mock --test anthropic_mock --test ollama_mock --test compaction_cache --test session_fixture_invariants --locked
      # 临时 example 每次都会因 mtime 变化重编译；这里只保留既有的 session 单测。
      - name: Test session catalog contract
        run: cargo test --locked -p jeikcode-capabilities --features session --lib session::manager::tests::catalog_scan_merges_physical_sources_and_keeps_diagnostics -- --exact
      # Linux x64 的 capabilities 运行时覆盖：PR 不跑以保持反馈速度。
      - name: Test capabilities lib (Ubuntu x64, push)
        if: github.event_name == 'push'
        run: cargo test --locked -p jeikcode-capabilities --lib
      - name: Test TUI library contracts (PR / manual)
        if: github.event_name != 'push'
        run: cargo test --locked -p jeikcode-tuix --lib -- --test-threads=1

  # daemon 全量 lib（597 用例，约 4.3m 运行时）：唯一需要 WebUI 产物的测试 job。
  # 该套件同时覆盖 webui::tests，因此不再单独跑 "Verify embedded WebUI"。
  rust-daemon:
    name: Rust daemon lib
    needs: webui-quality
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Isolate runtime home
        shell: bash
        run: echo "JEIKCODE_HOME=$RUNNER_TEMP/jeikcode-home" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ci-webui-dist
          path: webui/dist
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-rust-daemon"
          save-if: ${{ github.event_name == 'push' }}
      - name: Test daemon lib (includes embedded WebUI)
        run: cargo test -p jeikcode-daemon --lib --locked

  # 其余库套件都很轻（实际测试运行时间 < 6s），单独并行，避免串在 daemon 后面。
  rust-libs:
    name: Rust lib suites
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Isolate runtime home
        shell: bash
        run: echo "JEIKCODE_HOME=$RUNNER_TEMP/jeikcode-home" >> "$GITHUB_ENV"
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-rust-libs"
          save-if: ${{ github.event_name == 'push' }}
      - name: Test full lib suites
        run: cargo test --locked -p jeikcode-coding -p jeikcode-kernel -p jeikcode -p jeikcode-review -p jeikcode-telemetry --lib

  # 真实 arm64 安装器测试。PR 上跳过以保持反馈速度；
  # push/dispatch 在原生 arm64 上验证 linux-arm64 产物下载与校验。
  installer-integrity-arm64:
    name: Installer integrity (arm64)
    if: "!startsWith(github.event.head_commit.message, 'chore(release):') && github.event_name != 'pull_request'"
    runs-on: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Verify installer on native arm64
        run: python scripts/test_installers.py

  # 真实 arm64 Linux 原生 lib 测试。PR 上跳过以保持反馈速度；
  # push/dispatch 跑一次，覆盖发布前 qemu 之外的原生环境。
  # 进程级 build/冒烟已移到发布端（build.yml 的 published-binary smoke）：
  # 稳定面的契约由 daemon lib 里的 /health 路由单测覆盖，不再每次 push 编译并拉起 CLI。
  headless-arm64:
    name: Native arm64 tests
    # push 常跑；workflow_dispatch 可手动验证 runner 是否可用。
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: webui-quality
    # GitHub-hosted arm64 Linux runner label; override with repo variable
    # ARM64_RUNNER if the plan does not expose it (e.g. a self-hosted label).
    runs-on: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Isolate runtime home
        shell: bash
        run: echo "JEIKCODE_HOME=$RUNNER_TEMP/jeikcode-home" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: ci-webui-dist
          path: webui/dist
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "headless-arm64"
          save-if: ${{ github.event_name == 'push' }}
      # 原生 arm64 跑全部 lib 测试；比 qemu 更能暴露指令集/页大小/原子性问题。
      - name: Native arm64 library tests
        run: cargo test --locked --workspace --lib --no-fail-fast
