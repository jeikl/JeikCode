[target.x86_64-pc-windows-gnu]
linker = "gcc"
ar = "ar"

# Đường dẫn cross-compiler riêng từng máy được đặt trong cấu hình Cargo cục bộ
# hoặc CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER và AR_x86_64_unknown_linux_musl.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-self-contained=no"]

# 16K 页（树莓派 5 等）要求 PT_LOAD 对齐 >= 16384。4K 内核仍能加载这个二进制。
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
